<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevLink — NGO Management Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    /* hide scrollbar but keep scroll */
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    /* smooth sidebar transition */
    .sidebar-transition { transition: transform 0.25s ease; }
  </style>
</head>
<body class="bg-slate-100">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const API = 'http://localhost:5000/api';

async function apiFetch(path, options = {}) {
  const token = localStorage.getItem('devlink_token');
  const res = await fetch(`${API}${path}`, {
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    ...options,
  });
  if (res.status === 401) {
    localStorage.removeItem('devlink_token');
    localStorage.removeItem('devlink_user');
    window.location.reload();
  }
  return res;
}

const fmt = (n) => Number(n || 0).toLocaleString();
const pct = (a, t) => t > 0 ? Math.min(100, Math.round((a / t) * 100)) : 0;

const roleColor = {
  Admin:        'bg-purple-100 text-purple-700',
  Manager:      'bg-blue-100 text-blue-700',
  FieldOfficer: 'bg-green-100 text-green-700',
  Viewer:       'bg-gray-100 text-gray-700',
};

// ── Toast ─────────────────────────────────────────────────────
function Toast({ msg, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, []);
  return (
    <div className={`fixed top-4 right-4 left-4 sm:left-auto z-50 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm ${type === 'error' ? 'bg-red-500' : 'bg-green-500'}`}>
      <span className="flex-1">{msg}</span>
      <button onClick={onClose} className="font-bold text-lg leading-none">×</button>
    </div>
  );
}

// ── Login ─────────────────────────────────────────────────────
function LoginPage({ onLogin }) {
  const [form, setForm] = useState({ email: '', password: '' });
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true); setError('');
    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(form),
      });
      const data = await res.json();
      if (!res.ok) { setError(data.message); return; }
      localStorage.setItem('devlink_token', data.token);
      localStorage.setItem('devlink_user', JSON.stringify(data.user));
      onLogin(data.user);
    } catch {
      setError('Cannot connect to server. Is it running?');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-800 to-blue-900 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8">
        <div className="text-center mb-8">
          <div className="text-4xl font-bold text-blue-600 mb-1">DevLink</div>
          <p className="text-slate-500 text-sm">NGO Management Platform</p>
        </div>
        {error && (
          <div className="bg-red-50 border border-red-200 text-red-600 rounded-lg px-4 py-3 mb-4 text-sm">{error}</div>
        )}
        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
            <input type="email" required value={form.email}
              onChange={e => setForm({ ...form, email: e.target.value })}
              className="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
              placeholder="admin@devlink.org" />
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <input type="password" required value={form.password}
              onChange={e => setForm({ ...form, password: e.target.value })}
              className="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
              placeholder="••••••••" />
          </div>
          <button type="submit" disabled={loading}
            className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition disabled:opacity-60 text-sm">
            {loading ? 'Signing in…' : 'Sign In'}
          </button>
        </form>
        <p className="text-center text-xs text-slate-400 mt-6">
          Demo: admin@devlink.org / Admin@123
        </p>
      </div>
    </div>
  );
}

// ── Shared UI pieces ──────────────────────────────────────────
function StatCard({ label, value, icon, color, onClick }) {
  return (
    <div
      onClick={onClick}
      className={`bg-white rounded-xl shadow-sm p-4 flex items-center gap-3 transition-all
        ${onClick ? 'cursor-pointer hover:shadow-md hover:-translate-y-0.5 active:scale-95' : ''}`}
    >
      <div className={`text-2xl w-12 h-12 flex items-center justify-center rounded-xl shrink-0 ${color}`}>{icon}</div>
      <div className="flex-1 min-w-0">
        <div className="text-xl font-bold text-slate-800 leading-tight">{fmt(value)}</div>
        <div className="text-xs text-slate-500 leading-tight">{label}</div>
      </div>
      {onClick && <span className="text-slate-300 text-sm shrink-0">›</span>}
    </div>
  );
}

function ProgressBar({ actual, target, label }) {
  const p = pct(actual, target);
  const color = p >= 75 ? 'bg-green-500' : p >= 40 ? 'bg-yellow-400' : 'bg-red-400';
  return (
    <div>
      <div className="flex justify-between text-xs text-slate-600 mb-1">
        <span>{label}</span>
        <span>{fmt(actual)} / {fmt(target)} ({p}%)</span>
      </div>
      <div className="h-2 bg-slate-200 rounded-full overflow-hidden">
        <div className={`h-full ${color} rounded-full transition-all`} style={{ width: `${p}%` }} />
      </div>
    </div>
  );
}

// ── Modal wrapper (mobile-friendly) ──────────────────────────
function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-40 p-0 sm:p-4">
      <div className="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full sm:max-w-lg max-h-[92vh] overflow-y-auto">
        <div className="flex justify-between items-center px-5 py-4 border-b border-slate-100 sticky top-0 bg-white rounded-t-2xl z-10">
          <h3 className="text-base font-bold text-slate-800">{title}</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-2xl leading-none w-8 h-8 flex items-center justify-center">×</button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

// Input / Select helpers
const inputCls = "w-full border border-slate-300 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm";

// ── Dashboard ─────────────────────────────────────────────────
function Dashboard({ navigate, user }) {
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    apiFetch('/dashboard/stats').then(r => r.ok && r.json().then(setStats)).finally(() => setLoading(false));
  }, []);

  if (loading) return <div className="flex justify-center items-center h-40 text-slate-400 text-sm">Loading…</div>;
  if (!stats)  return <div className="text-red-500 mt-10 text-center text-sm">Failed to load dashboard.</div>;

  return (
    <div className="space-y-5">
      <h2 className="text-lg font-bold text-slate-800">Dashboard Overview</h2>

      <div className="grid grid-cols-2 gap-3">
        <StatCard label="Total Beneficiaries" value={stats.summary.total_beneficiaries} icon="👥" color="bg-blue-100 text-blue-600"    onClick={() => navigate('beneficiaries')} />
        <StatCard label="Active Projects"     value={stats.summary.total_projects}      icon="📁" color="bg-purple-100 text-purple-600" onClick={() => navigate('projects')} />
        <StatCard label="Activities Logged"   value={stats.summary.total_activities}    icon="📋" color="bg-green-100 text-green-600"   onClick={() => navigate('activities')} />
        <StatCard label="Team Members"        value={stats.summary.total_users}         icon="🧑‍💼" color="bg-orange-100 text-orange-600" onClick={user.role === 'Admin' ? () => navigate('users') : null} />
      </div>

      <div className="bg-white rounded-xl shadow-sm p-4">
        <h3 className="font-semibold text-slate-700 mb-4 text-sm">Project Performance</h3>
        {stats.projects.length === 0
          ? <p className="text-slate-400 text-sm">No projects yet.</p>
          : <div className="space-y-4">
              {stats.projects.map(p => (
                <div key={p.id} className="border border-slate-100 rounded-xl p-3">
                  <div className="font-medium text-slate-700 mb-3 text-sm">{p.title}</div>
                  <div className="space-y-2">
                    <ProgressBar actual={p.actual_beneficiaries} target={p.target_beneficiaries} label="Beneficiaries" />
                    <ProgressBar actual={p.actual_activities}    target={p.target_activities}    label="Activities" />
                  </div>
                </div>
              ))}
            </div>
        }
      </div>

      <div className="grid grid-cols-1 gap-4">
        <div className="bg-white rounded-xl shadow-sm p-4">
          <h3 className="font-semibold text-slate-700 mb-3 text-sm">Recent Activities</h3>
          {stats.recent_activities.length === 0
            ? <p className="text-slate-400 text-sm">No activities yet.</p>
            : <div className="space-y-3">
                {stats.recent_activities.map(a => (
                  <div key={a.id} className="flex gap-3 text-sm border-b border-slate-50 pb-2 last:border-0 last:pb-0">
                    <span className="text-base shrink-0 mt-0.5">📋</span>
                    <div>
                      <div className="font-medium text-slate-700 leading-tight">{a.activity_name}</div>
                      <div className="text-slate-400 text-xs mt-0.5">{a.project_title} · {a.activity_date?.slice(0,10)} · {a.total_attendees} attendees</div>
                    </div>
                  </div>
                ))}
              </div>
          }
        </div>

        <div className="bg-white rounded-xl shadow-sm p-4">
          <h3 className="font-semibold text-slate-700 mb-3 text-sm">Recent Registrations</h3>
          {stats.recent_beneficiaries.length === 0
            ? <p className="text-slate-400 text-sm">No beneficiaries yet.</p>
            : <div className="space-y-3">
                {stats.recent_beneficiaries.map(b => (
                  <div key={b.unique_id} className="flex gap-3 text-sm border-b border-slate-50 pb-2 last:border-0 last:pb-0">
                    <span className="text-base shrink-0 mt-0.5">👤</span>
                    <div>
                      <div className="font-medium text-slate-700 leading-tight">{b.full_name}</div>
                      <div className="text-slate-400 text-xs mt-0.5">{b.unique_id} · {b.location || 'N/A'}</div>
                    </div>
                  </div>
                ))}
              </div>
          }
        </div>
      </div>
    </div>
  );
}

// ── Beneficiaries ─────────────────────────────────────────────
function BeneficiariesPage({ user, toast }) {
  const [list, setList]         = useState([]);
  const [projects, setProjects] = useState([]);
  const [total, setTotal]       = useState(0);
  const [search, setSearch]     = useState('');
  const [page, setPage]         = useState(1);
  const [showForm, setShowForm] = useState(false);
  const [loading, setLoading]   = useState(false);
  const canWrite = ['Admin', 'Manager', 'FieldOfficer'].includes(user.role);
  const LIMIT = 15;

  const load = useCallback(async () => {
    setLoading(true);
    const res = await apiFetch(`/beneficiaries?search=${encodeURIComponent(search)}&page=${page}&limit=${LIMIT}`);
    if (res.ok) { const d = await res.json(); setList(d.data); setTotal(d.total); }
    setLoading(false);
  }, [search, page]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => { apiFetch('/projects').then(r => r.ok && r.json().then(setProjects)); }, []);

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-lg font-bold text-slate-800">Beneficiaries <span className="text-slate-400 font-normal text-sm">({fmt(total)})</span></h2>
        {canWrite && (
          <button onClick={() => setShowForm(true)}
            className="bg-blue-600 text-white px-3 py-2 rounded-xl text-sm font-medium hover:bg-blue-700">
            + Register
          </button>
        )}
      </div>

      <input type="text" placeholder="Search name, ID, phone…"
        value={search} onChange={e => { setSearch(e.target.value); setPage(1); }}
        className={inputCls} />

      {loading
        ? <div className="text-center py-10 text-slate-400 text-sm">Loading…</div>
        : <div className="space-y-2">
            {list.length === 0
              ? <div className="bg-white rounded-xl p-8 text-center text-slate-400 text-sm">No records found.</div>
              : list.map(b => (
                <div key={b.id} className="bg-white rounded-xl shadow-sm p-4">
                  <div className="flex justify-between items-start">
                    <div>
                      <div className="font-semibold text-slate-800 text-sm">{b.full_name}</div>
                      <div className="font-mono text-xs text-blue-600 mt-0.5">{b.unique_id}</div>
                    </div>
                    <span className="text-xs text-slate-400">{b.created_at?.slice(0,10)}</span>
                  </div>
                  <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500">
                    {b.phone    && <span>📞 {b.phone}</span>}
                    {b.location && <span>📍 {b.location}</span>}
                    {b.project_title && <span>📁 {b.project_title}</span>}
                    <span>👤 {b.registered_by_name || 'N/A'}</span>
                  </div>
                </div>
              ))
            }
          </div>
      }

      <div className="flex justify-between items-center text-xs text-slate-500 pt-1">
        <span>{Math.min((page-1)*LIMIT+1,total)}–{Math.min(page*LIMIT,total)} of {fmt(total)}</span>
        <div className="flex gap-2">
          <button onClick={() => setPage(p => Math.max(1,p-1))} disabled={page===1}
            className="px-3 py-1.5 border rounded-lg disabled:opacity-40 hover:bg-slate-100 text-xs">← Prev</button>
          <button onClick={() => setPage(p => p+1)} disabled={page*LIMIT>=total}
            className="px-3 py-1.5 border rounded-lg disabled:opacity-40 hover:bg-slate-100 text-xs">Next →</button>
        </div>
      </div>

      {showForm && (
        <Modal title="Register New Beneficiary" onClose={() => setShowForm(false)}>
          <BeneficiaryForm projects={projects}
            onClose={() => setShowForm(false)}
            onSaved={() => { setShowForm(false); load(); toast('Beneficiary registered!', 'success'); }}
            toast={toast} />
        </Modal>
      )}
    </div>
  );
}

function BeneficiaryForm({ projects, onClose, onSaved, toast }) {
  const [form, setForm] = useState({ full_name:'', phone:'', location:'', gender:'Other', age:'', project_id:'' });
  const [saving, setSaving] = useState(false);
  const s = (k) => (e) => setForm({...form, [k]: e.target.value});

  const handleSubmit = async (e) => {
    e.preventDefault(); setSaving(true);
    const res = await apiFetch('/beneficiaries', { method:'POST', body: JSON.stringify(form) });
    if (res.ok) onSaved();
    else { const d = await res.json(); toast(d.message, 'error'); }
    setSaving(false);
  };

  return (
    <form onSubmit={handleSubmit} className="space-y-3">
      <div>
        <label className="block text-xs font-medium text-slate-700 mb-1">Full Name *</label>
        <input required value={form.full_name} onChange={s('full_name')} className={inputCls} />
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">Phone</label>
          <input value={form.phone} onChange={s('phone')} className={inputCls} />
        </div>
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">Age</label>
          <input type="number" value={form.age} onChange={s('age')} className={inputCls} />
        </div>
      </div>
      <div>
        <label className="block text-xs font-medium text-slate-700 mb-1">Location</label>
        <input value={form.location} onChange={s('location')} className={inputCls} />
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">Gender</label>
          <select value={form.gender} onChange={s('gender')} className={inputCls}>
            <option>Male</option><option>Female</option><option>Other</option>
          </select>
        </div>
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">Project</label>
          <select value={form.project_id} onChange={s('project_id')} className={inputCls}>
            <option value="">— None —</option>
            {projects.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
          </select>
        </div>
      </div>
      <div className="flex gap-3 pt-2">
        <button type="button" onClick={onClose} className="flex-1 border border-slate-300 text-slate-700 py-2.5 rounded-xl text-sm hover:bg-slate-50">Cancel</button>
        <button type="submit" disabled={saving} className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-sm hover:bg-blue-700 disabled:opacity-60">
          {saving ? 'Saving…' : 'Register'}
        </button>
      </div>
    </form>
  );
}

// ── Projects ──────────────────────────────────────────────────
function ProjectsPage({ user, toast }) {
  const [list, setList]         = useState([]);
  const [showForm, setShowForm] = useState(false);
  const canWrite = ['Admin', 'Manager'].includes(user.role);

  const load = async () => {
    const res = await apiFetch('/projects');
    if (res.ok) setList(await res.json());
  };
  useEffect(() => { load(); }, []);

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-lg font-bold text-slate-800">Projects</h2>
        {canWrite && (
          <button onClick={() => setShowForm(true)}
            className="bg-blue-600 text-white px-3 py-2 rounded-xl text-sm font-medium hover:bg-blue-700">
            + New
          </button>
        )}
      </div>

      <div className="space-y-3">
        {list.length === 0
          ? <div className="bg-white rounded-xl p-8 text-center text-slate-400 text-sm">No projects yet.</div>
          : list.map(p => (
            <div key={p.id} className="bg-white rounded-xl shadow-sm p-4">
              <div className="flex justify-between items-start mb-1">
                <h3 className="font-semibold text-slate-800 text-sm">{p.title}</h3>
              </div>
              {(p.start_date || p.end_date) && (
                <div className="text-xs text-slate-400 mb-2">{p.start_date?.slice(0,10)} → {p.end_date?.slice(0,10)}</div>
              )}
              {p.description && <p className="text-xs text-slate-500 mb-3">{p.description}</p>}
              <div className="space-y-2">
                <ProgressBar actual={p.actual_beneficiaries} target={p.target_beneficiaries} label="Beneficiaries" />
                <ProgressBar actual={p.actual_activities}    target={p.target_activities}    label="Activities" />
              </div>
              <div className="mt-2 text-xs text-slate-400">By {p.created_by_name}</div>
            </div>
          ))
        }
      </div>

      {showForm && (
        <Modal title="Create New Project" onClose={() => setShowForm(false)}>
          <ProjectForm
            onClose={() => setShowForm(false)}
            onSaved={() => { setShowForm(false); load(); toast('Project created!', 'success'); }}
            toast={toast} />
        </Modal>
      )}
    </div>
  );
}

    if (res.ok) onSaved();
    else { const d = await res.json(); toast(d.message, 'error'); }
    setSaving(false);
  };

  return (
    <form onSubmit={handleSubmit} className="space-y-3">
      <div>
        <label className="block text-xs font-medium text-slate-700 mb-1">Project Title *</label>
        <input required value={form.title} onChange={s('title')} className={inputCls} />
      </div>
      <div>
        <label className="block text-xs font-medium text-slate-700 mb-1">Description</label>
        <textarea rows={3} value={form.description} onChange={s('description')} className={`${inputCls} resize-none`} />
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">Start Date</label>
          <input type="date" value={form.start_date} onChange={s('start_date')} className={inputCls} />
        </div>
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">End Date</label>
          <input type="date" value={form.end_date} onChange={s('end_date')} className={inputCls} />
        </div>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">Target Beneficiaries</label>

        </div>
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">Target Activities</label>
          <input type="number" min="0" value={form.target_activities} onChange={s('target_activities')} className={inputCls} />
        </div>
      </div>
      <div className="flex gap-3 pt-2">
        <button type="button" onClick={onClose} className="flex-1 border border-slate-300 text-slate-700 py-2.5 rounded-xl text-sm hover:bg-slate-50">Cancel</button>

          {saving ? 'Saving…' : 'Create'}
        </button>
      </div>
    </form>
  );
}

// ── Activities ────────────────────────────────────────────────
function ActivitiesPage({ user, toast }) {
  const [list, setList]         = useState([]);
  const [projects, setProjects] = useState([]);
  const [filter, setFilter]     = useState({ project_id:'', from_date:'', to_date:'' });
  const [showForm, setShowForm] = useState(false);
  const canWrite = ['Admin', 'Manager', 'FieldOfficer'].includes(user.role);

  const load = useCallback(async () => {
    const q = new URLSearchParams(filter).toString();
    const res = await apiFetch(`/activities?${q}`);
    if (res.ok) setList(await res.json());
  }, [filter]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => { apiFetch('/projects').then(r => r.ok && r.json().then(setProjects)); }, []);

  const typeColor = {
    Training:'bg-blue-100 text-blue-700', Meeting:'bg-purple-100 text-purple-700',
    Distribution:'bg-green-100 text-green-700', Survey:'bg-yellow-100 text-yellow-700', Other:'bg-gray-100 text-gray-700'
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-lg font-bold text-slate-800">Activities</h2>
        {canWrite && (
          <button onClick={() => setShowForm(true)}
            className="bg-blue-600 text-white px-3 py-2 rounded-xl text-sm font-medium hover:bg-blue-700">
            + Log
          </button>
        )}
      </div>

      {/* Filters */}
      <div className="bg-white rounded-xl shadow-sm p-3 flex flex-col gap-2">
        <select value={filter.project_id} onChange={e => setFilter({...filter, project_id:e.target.value})} className={inputCls}>
          <option value="">All Projects</option>
          {projects.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
        </select>
        <div className="grid grid-cols-2 gap-2">
          <input type="date" value={filter.from_date} onChange={e => setFilter({...filter, from_date:e.target.value})} className={inputCls} />
          <input type="date" value={filter.to_date}   onChange={e => setFilter({...filter, to_date:e.target.value})}   className={inputCls} />
        </div>
        <button onClick={() => setFilter({ project_id:'', from_date:'', to_date:'' })}
          className="text-xs text-slate-500 hover:text-slate-800 text-left px-1">Clear filters</button>
      </div>

      <div className="space-y-2">
        {list.length === 0
          ? <div className="bg-white rounded-xl p-8 text-center text-slate-400 text-sm">No activities found.</div>
          : list.map(a => (
            <div key={a.id} className="bg-white rounded-xl shadow-sm p-4">
              <div className="flex justify-between items-start">
                <div>
                  <div className="font-semibold text-slate-800 text-sm">{a.activity_name}</div>
                  <div className="text-xs text-slate-400 mt-0.5">{a.project_title}</div>
                </div>
                <span className={`text-xs px-2 py-1 rounded-full font-medium shrink-0 ml-2 ${typeColor[a.activity_type] || typeColor.Other}`}>{a.activity_type}</span>
              </div>
              <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500">
                <span>📅 {a.activity_date?.slice(0,10)}</span>
                {a.location && <span>📍 {a.location}</span>}
                <span>👥 {fmt(a.attendance_count)} attendees</span>
                {a.officer_name && <span>👤 {a.officer_name}</span>}
              </div>
            </div>
          ))
        }
      </div>

      {showForm && (
        <Modal title="Log New Activity" onClose={() => setShowForm(false)}>
          <ActivityForm projects={projects}
            onClose={() => setShowForm(false)}
            onSaved={() => { setShowForm(false); load(); toast('Activity logged!', 'success'); }}
            toast={toast} />
        </Modal>
      )}
    </div>
  );
}

function ActivityForm({ projects, onClose, onSaved, toast }) {
  const [form, setForm] = useState({ project_id:'', activity_name:'', activity_type:'Training', activity_date:'', location:'', notes:'' });
  const [saving, setSaving] = useState(false);
  const s = (k) => (e) => setForm({...form, [k]: e.target.value});

  const handleSubmit = async (e) => {
    e.preventDefault(); setSaving(true);
    const res = await apiFetch('/activities', { method:'POST', body: JSON.stringify(form) });
    if (res.ok) onSaved();
    else { const d = await res.json(); toast(d.message, 'error'); }
    setSaving(false);
  };

  return (
    <form onSubmit={handleSubmit} className="space-y-3">
      <div>
        <label className="block text-xs font-medium text-slate-700 mb-1">Project *</label>
        <select required value={form.project_id} onChange={s('project_id')} className={inputCls}>
          <option value="">Select project…</option>
          {projects.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
        </select>
      </div>
      <div>
        <label className="block text-xs font-medium text-slate-700 mb-1">Activity Name *</label>
        <input required value={form.activity_name} onChange={s('activity_name')} className={inputCls} />
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">Type</label>
          <select value={form.activity_type} onChange={s('activity_type')} className={inputCls}>
            {['Training','Meeting','Distribution','Survey','Other'].map(t => <option key={t}>{t}</option>)}
          </select>
        </div>
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">Date *</label>
          <input required type="date" value={form.activity_date} onChange={s('activity_date')} className={inputCls} />
        </div>
      </div>
      <div>
        <label className="block text-xs font-medium text-slate-700 mb-1">Location</label>
        <input value={form.location} onChange={s('location')} className={inputCls} />
      </div>
      <div>
        <label className="block text-xs font-medium text-slate-700 mb-1">Notes</label>
        <textarea rows={2} value={form.notes} onChange={s('notes')} className={`${inputCls} resize-none`} />
      </div>
      <div className="flex gap-3 pt-2">
        <button type="button" onClick={onClose} className="flex-1 border border-slate-300 text-slate-700 py-2.5 rounded-xl text-sm hover:bg-slate-50">Cancel</button>
        <button type="submit" disabled={saving} className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-sm hover:bg-blue-700 disabled:opacity-60">
          {saving ? 'Saving…' : 'Log Activity'}
        </button>
      </div>
    </form>
  );
}

// ── Reports ───────────────────────────────────────────────────
function ReportsPage({ user, toast }) {
  const [projects, setProjects] = useState([]);
  const [filter, setFilter]     = useState({ project_id:'', from_date:'', to_date:'', type:'activities', format:'csv' });
  const [exporting, setExporting] = useState(false);
  const canExport = ['Admin','Manager'].includes(user.role);
  const s = (k) => (e) => setFilter({...filter, [k]: e.target.value});

  useEffect(() => { apiFetch('/projects').then(r => r.ok && r.json().then(setProjects)); }, []);

  const formatInfo = {
    csv:  { label:'CSV',        icon:'📄', desc:'Excel & Google Sheets compatible' },
    xlsx: { label:'Excel',      icon:'📊', desc:'Formatted spreadsheet with columns' },
    json: { label:'JSON',       icon:'🔧', desc:'For developers & system integrations' },
    pdf:  { label:'PDF Report', icon:'📋', desc:'Printable report with header & footer' },
  };

  const handleExport = async () => {
    setExporting(true);
    const q = new URLSearchParams(filter).toString();
    const res = await apiFetch(`/dashboard/export?${q}`);
    if (!res.ok) {
      const d = await res.json();
      toast(d.message, 'error');
      setExporting(false);
      return;
    }
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `devlink_${filter.type}_${Date.now()}.${filter.format}`;
    a.click();
    URL.revokeObjectURL(url);
    toast(`${formatInfo[filter.format].label} downloaded!`, 'success');
    setExporting(false);
  };

  return (
    <div className="space-y-4">
      <h2 className="text-lg font-bold text-slate-800">Reports & Export</h2>

      <div className="bg-white rounded-xl shadow-sm p-4 space-y-4">
        <h3 className="font-semibold text-slate-700 text-sm">Export Data</h3>

        {/* Data type + Project */}
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-xs font-medium text-slate-700 mb-1">Data Type</label>
            <select value={filter.type} onChange={s('type')} className={inputCls}>
              <option value="activities">Activity Logs</option>
              <option value="beneficiaries">Beneficiaries</option>
            </select>
          </div>
          <div>
            <label className="block text-xs font-medium text-slate-700 mb-1">Project</label>
            <select value={filter.project_id} onChange={s('project_id')} className={inputCls}>
              <option value="">All Projects</option>
              {projects.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
            </select>
          </div>
        </div>

        {/* Date range */}
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-xs font-medium text-slate-700 mb-1">From Date</label>
            <input type="date" value={filter.from_date} onChange={s('from_date')} className={inputCls} />
          </div>
          <div>
            <label className="block text-xs font-medium text-slate-700 mb-1">To Date</label>
            <input type="date" value={filter.to_date} onChange={s('to_date')} className={inputCls} />
          </div>
        </div>

        {/* Format selector — card style */}
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-2">Export Format</label>
          <div className="grid grid-cols-2 gap-2">
            {Object.entries(formatInfo).map(([key, info]) => (
              <div key={key} onClick={() => setFilter({...filter, format: key})}
                className={`border-2 rounded-xl p-3 cursor-pointer transition-all
                  ${filter.format === key
                    ? 'border-blue-500 bg-blue-50'
                    : 'border-slate-200 hover:border-slate-300 bg-white'}`}>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-lg">{info.icon}</span>
                  <span className={`text-sm font-semibold ${filter.format === key ? 'text-blue-700' : 'text-slate-700'}`}>
                    {info.label}
                  </span>
                  {filter.format === key && <span className="ml-auto text-blue-500 text-xs font-bold">✓</span>}
                </div>
                <p className="text-xs text-slate-400 pl-7">{info.desc}</p>
              </div>
            ))}
          </div>
        </div>

        {canExport
          ? <button onClick={handleExport} disabled={exporting}
              className="w-full bg-blue-600 text-white py-3 rounded-xl text-sm font-semibold hover:bg-blue-700 disabled:opacity-60 flex items-center justify-center gap-2 transition-all">
              {exporting
                ? <><span className="animate-spin">⚙️</span> Preparing…</>
                : <><span>⬇</span> Download {formatInfo[filter.format].label}</>
              }
            </button>
          : <p className="text-xs text-red-500 text-center py-2">Only Admins and Managers can export reports.</p>
        }
      </div>

      {/* Info box */}
      <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2 text-xs text-slate-500">
        <p className="font-semibold text-slate-600 text-sm">Format Guide</p>
        <div className="space-y-1.5">
          <div className="flex gap-2"><span>📄</span><span><b>CSV</b> — Open directly in Excel or Google Sheets. Best for raw data analysis.</span></div>
          <div className="flex gap-2"><span>📊</span><span><b>Excel</b> — Pre-formatted spreadsheet with proper columns. Best for sharing with donors.</span></div>
          <div className="flex gap-2"><span>🔧</span><span><b>JSON</b> — Structured data for developers or system imports.</span></div>
          <div className="flex gap-2"><span>📋</span><span><b>PDF</b> — Printable report with branding. Best for formal donor submissions.</span></div>
        </div>
      </div>
    </div>
  );
}

// ── Users ─────────────────────────────────────────────────────
function UsersPage({ user, toast }) {
  const [list, setList]         = useState([]);
  const [showForm, setShowForm] = useState(false);

  const load = async () => {
    const res = await apiFetch('/users');
    if (res.ok) setList(await res.json());
  };
  useEffect(() => { load(); }, []);

  const toggleUser = async (id) => {
    await apiFetch(`/users/${id}/toggle`, { method:'PUT' });
    load(); toast('User status updated.', 'success');
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-lg font-bold text-slate-800">Users</h2>
        <button onClick={() => setShowForm(true)}
          className="bg-blue-600 text-white px-3 py-2 rounded-xl text-sm font-medium hover:bg-blue-700">
          + Add User
        </button>
      </div>

      <div className="space-y-2">
        {list.map(u => (
          <div key={u.id} className="bg-white rounded-xl shadow-sm p-4">
            <div className="flex justify-between items-start">
              <div>
                <div className="font-semibold text-slate-800 text-sm">{u.name}</div>
                <div className="text-xs text-slate-400 mt-0.5">{u.email}</div>
              </div>
              <span className={`text-xs px-2 py-1 rounded-full font-medium shrink-0 ml-2 ${roleColor[u.role]}`}>{u.role}</span>
            </div>
            <div className="flex items-center justify-between mt-3">
              <span className={`text-xs px-2 py-1 rounded-full font-medium ${u.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                {u.is_active ? 'Active' : 'Inactive'}
              </span>
              {u.id !== user.id && (
                <button onClick={() => toggleUser(u.id)}
                  className={`text-xs px-3 py-1.5 rounded-lg font-medium ${u.is_active ? 'bg-red-50 text-red-600 hover:bg-red-100' : 'bg-green-50 text-green-600 hover:bg-green-100'}`}>
                  {u.is_active ? 'Deactivate' : 'Activate'}
                </button>
              )}
            </div>
          </div>
        ))}
      </div>

      {showForm && (
        <Modal title="Add New User" onClose={() => setShowForm(false)}>
          <AddUserForm
            onClose={() => setShowForm(false)}
            onSaved={() => { setShowForm(false); load(); toast('User created!', 'success'); }}
            toast={toast} />
        </Modal>
      )}
    </div>
  );
}

function AddUserForm({ onClose, onSaved, toast }) {
  const [form, setForm] = useState({ name:'', email:'', password:'', role:'FieldOfficer' });
  const [saving, setSaving] = useState(false);
  const s = (k) => (e) => setForm({...form, [k]: e.target.value});

  const handleSubmit = async (e) => {
    e.preventDefault(); setSaving(true);
    const res = await apiFetch('/auth/register', { method:'POST', body: JSON.stringify(form) });
    if (res.ok) onSaved();
    else { const d = await res.json(); toast(d.message, 'error'); }
    setSaving(false);
  };

  return (
    <form onSubmit={handleSubmit} className="space-y-3">
      {[['Full Name','name','text'],['Email','email','email'],['Password','password','password']].map(([label,key,type]) => (
        <div key={key}>
          <label className="block text-xs font-medium text-slate-700 mb-1">{label} *</label>
          <input required type={type} value={form[key]} onChange={s(key)} className={inputCls} />
        </div>
      ))}
      <div>
        <label className="block text-xs font-medium text-slate-700 mb-1">Role</label>
        <select value={form.role} onChange={s('role')} className={inputCls}>
          {['Admin','Manager','FieldOfficer','Viewer'].map(r => <option key={r}>{r}</option>)}
        </select>
      </div>
      <div className="flex gap-3 pt-2">
        <button type="button" onClick={onClose} className="flex-1 border border-slate-300 text-slate-700 py-2.5 rounded-xl text-sm hover:bg-slate-50">Cancel</button>
        <button type="submit" disabled={saving} className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-sm hover:bg-blue-700 disabled:opacity-60">
          {saving ? 'Creating…' : 'Create User'}
        </button>
      </div>
    </form>
  );
}

// ── Main App ──────────────────────────────────────────────────
function App() {
  const [user, setUser]       = useState(() => {
    try { return JSON.parse(localStorage.getItem('devlink_user')); } catch { return null; }
  });
  const [page, setPage]       = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [toast, setToast]     = useState(null);

  const showToast = (msg, type = 'success') => setToast({ msg, type });

  const handleLogout = () => {
    localStorage.removeItem('devlink_token');
    localStorage.removeItem('devlink_user');
    setUser(null);
  };

  const navigate = (key) => {
    setPage(key);
    setSidebarOpen(false); // close sidebar on mobile after tap
  };

  if (!user) return <LoginPage onLogin={u => { setUser(u); setPage('dashboard'); }} />;

  const navItems = [
    { key:'dashboard',     label:'Dashboard',    icon:'📊' },
    { key:'beneficiaries', label:'Beneficiaries', icon:'👥' },
    { key:'projects',      label:'Projects',      icon:'📁' },
    { key:'activities',    label:'Activities',    icon:'📋' },
    ...(['Admin','Manager'].includes(user.role) ? [{ key:'reports', label:'Reports', icon:'📈' }] : []),
    ...(user.role === 'Admin' ? [{ key:'users', label:'Users', icon:'🧑‍💼' }] : []),
  ];

  const pageTitle = navItems.find(n => n.key === page)?.label || 'DevLink';

  return (
    <div className="flex h-screen overflow-hidden bg-slate-100">
      {toast && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}

      {/* Overlay for mobile sidebar */}
      {sidebarOpen && (
        <div className="fixed inset-0 bg-black/40 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />
      )}

      {/* Sidebar */}
      <aside className={`
        fixed top-0 left-0 h-full w-64 bg-slate-800 flex flex-col z-40
        sidebar-transition
        ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}
        lg:translate-x-0 lg:static lg:z-auto
      `}>
        {/* Logo */}
        <div className="px-5 py-5 border-b border-slate-700 flex items-center justify-between">
          <div>
            <div className="text-xl font-bold text-white">DevLink</div>
            <div className="text-xs text-slate-400">NGO Management Platform</div>
          </div>
          <button onClick={() => setSidebarOpen(false)} className="lg:hidden text-slate-400 hover:text-white text-xl">×</button>
        </div>

        {/* Nav */}
        <nav className="flex-1 p-3 space-y-0.5 overflow-y-auto no-scroll">
          {navItems.map(n => (
            <div key={n.key} onClick={() => navigate(n.key)}
              className={`flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer transition-all text-sm
                ${page === n.key ? 'bg-blue-600 text-white font-medium' : 'text-slate-300 hover:bg-slate-700 hover:text-white'}`}>
              <span className="text-base w-5 text-center">{n.icon}</span>
              <span>{n.label}</span>
            </div>
          ))}
        </nav>

        {/* User info */}
        <div className="p-3 border-t border-slate-700">
          <div className="px-3 py-3 rounded-xl bg-slate-700/60">
            <div className="text-sm font-medium text-white truncate">{user.name}</div>
            <div className="text-xs text-slate-400 truncate">{user.email}</div>
            <span className={`text-xs px-2 py-0.5 rounded-full font-medium mt-1.5 inline-block ${roleColor[user.role]}`}>{user.role}</span>
          </div>
          <button onClick={handleLogout}
            className="mt-1.5 w-full text-left px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white text-sm transition flex items-center gap-2">
            <span>🚪</span><span>Sign Out</span>
          </button>
        </div>
      </aside>

      {/* Main area */}
      <div className="flex-1 flex flex-col overflow-hidden">

        {/* Top bar (mobile only) */}
        <header className="lg:hidden bg-white border-b border-slate-200 px-4 py-3 flex items-center gap-3 shrink-0">
          <button onClick={() => setSidebarOpen(true)}
            className="text-slate-600 hover:text-slate-900 p-1">
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <span className="font-bold text-blue-600 text-lg">DevLink</span>
          <span className="text-slate-500 text-sm ml-1">/ {pageTitle}</span>
        </header>

        {/* Page content */}
        <main className="flex-1 overflow-y-auto">
          <div className="p-4 sm:p-6">
            {page === 'dashboard'     && <Dashboard navigate={navigate} user={user} />}
            {page === 'beneficiaries' && <BeneficiariesPage user={user} toast={showToast} />}
            {page === 'projects'      && <ProjectsPage     user={user} toast={showToast} />}
            {page === 'activities'    && <ActivitiesPage   user={user} toast={showToast} />}
            {page === 'reports'       && <ReportsPage      user={user} toast={showToast} />}
            {page === 'users'         && <UsersPage        user={user} toast={showToast} />}
          </div>
        </main>

        {/* Bottom nav bar (mobile only) */}
        <nav className="lg:hidden bg-white border-t border-slate-200 flex shrink-0">
          {navItems.slice(0, 5).map(n => (
            <button key={n.key} onClick={() => navigate(n.key)}
              className={`flex-1 flex flex-col items-center gap-0.5 py-2.5 text-xs transition-all
                ${page === n.key ? 'text-blue-600 font-semibold' : 'text-slate-400 hover:text-slate-700'}`}>
              <span className="text-lg leading-none">{n.icon}</span>
              <span className="text-[10px] leading-tight">{n.label.split(' ')[0]}</span>
            </button>
          ))}
        </nav>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
